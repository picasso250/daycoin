name: UBIC1-v0.2 isolated browser E2E

on:
  push:
    paths:
      - 'contracts/UBIC1V02.sol'
      - 'scripts/compile.mjs'
      - 'scripts/compile-v02.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'test/ubic-v02.test.mjs'
      - 'sites/ubic1-v02/**'
      - '.github/workflows/ubic1-v02-e2e.yml'
  pull_request:
    paths:
      - 'contracts/UBIC1V02.sol'
      - 'scripts/compile.mjs'
      - 'scripts/compile-v02.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'test/ubic-v02.test.mjs'
      - 'sites/ubic1-v02/**'
      - '.github/workflows/ubic1-v02-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Chromium + Ganache (no mainnet)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout fixed repository commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 reviewed commit

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 reviewed commit
        with:
          node-version: '22'

      - name: Install contract testing dependencies
        # Existing Windows lockfile misclassifies macOS-only fsevents; preserve
        # locked versions while bypassing npm's platform rejection in isolated CI.
        run: npm ci --force --ignore-scripts --no-audit --no-fund

      - name: Install independent v0.2 UI testing dependencies
        run: npm ci --prefix sites/ubic1-v02 --ignore-scripts --no-audit --no-fund

      - name: Install browser runtime
        working-directory: sites/ubic1-v02
        run: npx playwright-core install --with-deps chromium

      - name: Compile v0.2 locally (no signing or deployment)
        run: npm run build:v02

      - name: Run v0.2 contract tests
        run: npm run test:v02

      - name: Run v0.2 UI tests and browser E2E
        run: npm --prefix sites/ubic1-v02 test

      - name: Confirm v0.2 defaults are disconnected from all networks
        run: |
          test ! -f sites/ubic1-v02/dist/deployment.json
          node --input-type=module -e "import {CONFIG} from './sites/ubic1-v02/dist/config.mjs'; for (const key of ['chainId','address','runtimeHash','rpcUrl','explorerUrl']) { if (CONFIG[key] !== null) throw Error(key+' must stay null in committed UI'); } console.log('v0.2 remains undeployed and disabled')"
